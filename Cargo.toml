[package]
name = "bma425"
version = "0.1.0"
edition = "2024"
description = "BMA425 triaxial acceleration sensor driver for embedded hal / no_std"
repository = "https://github.com/Sir-Thomas/bma425-rs"
license = "MIT OR Apache-2.0"
categories = [
    "embedded",
    "hardware-support",
    "no-std::no-alloc",
    "asynchronous",
]
keywords = [
    "embedded-hal-driver",
    "BMA425",
    "accelerometer",
    "PineTime",
]

[features]
defmt = ["dep:defmt", "embedded-hal/defmt-03", "embedded-hal-async/defmt-03"]

[dependencies]
defmt = { version = "1.2.0", optional = true }
defmt-rtt = "1.3.1"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
